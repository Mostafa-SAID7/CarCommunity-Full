name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (for example 1.2.0)'
        required: true
        type: string
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then VERSION="$INPUT_VERSION"; else VERSION="$(date -u +'%Y.%-m.%-d')-${GITHUB_RUN_NUMBER}"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid semantic version'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build -- --configuration production
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" frontend/dist/** --title "v$VERSION" --generate-notes
